services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_DOTNET_URL: ""
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

  api:
    build:
      context: ./llm-wiki-server
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:5200"
      Cors__Origins__0: "${PUBLIC_ORIGIN:-http://localhost:8080}"
      LlmWikiCloud__ApiKey: "${LLM_WIKI_API_KEY}"
      LlmWikiCloud__Projects__proj_123: "/data/wiki/project"
      Qdrant__Host: "qdrant"
      Qdrant__Port: "6334"
    volumes:
      - "${WIKI_PROJECT_PATH:-./data/wiki/project}:/data/wiki/project"
    depends_on:
      - qdrant
    expose:
      - "5200"

  qdrant:
    image: qdrant/qdrant:v1.12.5
    volumes:
      - qdrant_storage:/qdrant/storage
    expose:
      - "6333"
      - "6334"

volumes:
  qdrant_storage:
