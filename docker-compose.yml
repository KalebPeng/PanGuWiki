services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_DOTNET_URL: ""
        VITE_WIKI_PARENT_DIR: "${WIKI_ROOT_PATH_INTERNAL:-/data/wiki}"
        VITE_MULTI_TENANT: "${VITE_MULTI_TENANT:-true}"
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

  api:
    build:
      context: ./llm-wiki-server
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:5200"
      Cors__Origins__0: "${PUBLIC_ORIGIN:-http://localhost:8080}"
      WikiProjects__RootPath: "${WIKI_ROOT_PATH_INTERNAL:-/data/wiki}"
      LlmWikiCloud__ApiKey: "${LLM_WIKI_API_KEY}"
      LlmWikiCloud__Projects__proj_123: "${WIKI_ROOT_PATH_INTERNAL:-/data/wiki}/PanGu-Wiki"
      Qdrant__Host: "qdrant"
      Qdrant__Port: "6334"
      ConnectionStrings__Default: "Host=postgres;Database=llmwiki;Username=llmwiki;Password=${POSTGRES_PASSWORD:-changeme}"
      Jwt__Secret: "${JWT_SECRET:-CHANGEME-minimum-32-character-dev-secret!!}"
      Jwt__Issuer: "llmwiki"
      Jwt__Audience: "llmwiki"
      InitialAdmin__Email: "${INITIAL_ADMIN_EMAIL:-}"
      InitialAdmin__Password: "${INITIAL_ADMIN_PASSWORD:-}"
      InitialAdmin__DisplayName: "${INITIAL_ADMIN_NAME:-Admin}"
      DataProtection__KeysPath: /data/keys
    volumes:
      - "${WIKI_ROOT_PATH:-./data/wiki}:${WIKI_ROOT_PATH_INTERNAL:-/data/wiki}"
      - dp_keys:/data/keys
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5200/api/health/ingest-worker"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy
    expose:
      - "5200"

  qdrant:
    image: qdrant/qdrant:v1.12.5
    volumes:
      - qdrant_storage:/qdrant/storage
    expose:
      - "6333"
      - "6334"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: llmwiki
      POSTGRES_USER: llmwiki
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-changeme}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmwiki -d llmwiki"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  qdrant_storage:
  pgdata:
  dp_keys:
